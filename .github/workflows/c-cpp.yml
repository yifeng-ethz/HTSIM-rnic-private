name: C++ Build and Test CI

on:
  push:
    branches: [main, "2026_08_05/simllm-addon"]
  pull_request:

jobs:
  build:
    name: Build and Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make g++ cmake

      - name: Configure CMake project
        run: cmake -S htsim/sim -B build -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build CMake project
        run: cmake --build build --config Release --parallel

      - name: Run CTests
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
